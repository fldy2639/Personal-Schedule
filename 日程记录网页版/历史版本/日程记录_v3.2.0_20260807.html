<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研日程记录表 V3</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 16px;
            color: #333;
        }
        .app-header {
            max-width: 1400px;
            margin: 0 auto 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }
        .date-section .current-date { font-size: 1.25rem; font-weight: 600; color: #2c3e50; }
        .date-section .current-time { font-size: .95rem; color: #7f8c8d; font-family: monospace; }
        .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border: none; border-radius: 8px;
            font-size: .9rem; cursor: pointer; transition: background .2s, opacity .2s;
        }
        .btn:hover { opacity: .92; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-secondary { background: #95a5a6; color: #fff; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-outline { background: #fff; color: #3498db; border: 1px solid #3498db; }
        .btn-small { padding: 5px 10px; font-size: .82rem; }
        .main-grid {
            max-width: 1400px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        @media (max-width: 960px) { .main-grid { grid-template-columns: 1fr; } }
        .card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            overflow: hidden;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; border-bottom: 1px solid #eee;
            background: #fafbfc;
        }
        .card-title { font-weight: 600; font-size: 1rem; color: #2c3e50; display: flex; align-items: center; gap: 8px; }
        .card-body { padding: 16px 18px; }
        .metric-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;
        }
        .metric-card {
            padding: 10px 12px; border-radius: 8px; background: #f8f9fa; border: 1px solid #eee;
        }
        .metric-card .label { font-size: .75rem; color: #7f8c8d; margin-bottom: 4px; }
        .metric-card .value { font-size: 1.15rem; font-weight: 600; color: #2c3e50; }
        .metric-card.focus .value { color: #2563eb; }
        .metric-card.progress .value { color: #ea580c; }
        .metric-hint { font-size: .78rem; color: #e67e22; margin-top: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; font-weight: 500; }
        .form-group input[type="text"], .form-group input[type="time"], .form-group input[type="number"],
        .form-group select, .form-group textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: .9rem;
        }
        .form-group textarea { min-height: 60px; resize: vertical; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 120px; }
        .reflection-item { margin-bottom: 16px; }
        .reflection-item label { font-size: .88rem; font-weight: 600; color: #34495e; display: block; margin-bottom: 8px; }
        .reflection-item textarea {
            width: 100%; min-height: 96px; padding: 10px 12px;
            border: 1px solid #ddd; border-radius: 8px; font-size: .9rem;
            line-height: 1.55; resize: vertical;
        }
        .reflection-item textarea:focus { border-color: #3498db; outline: none; box-shadow: 0 0 0 2px rgba(52,152,219,.12); }
        .reflection-item textarea.refl-extra { min-height: 120px; }
        .task-item, .block-card {
            border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fafbfc;
        }
        .task-item.mainline { border-left: 3px solid #3498db; }
        .block-card.selected { border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,.2); }
        .block-card.unclosed { border-left: 3px solid #bdc3c7; }
        .block-card.work { border-left-width: 4px; }
        .block-card.compact {
            padding: 8px 10px; margin-bottom: 6px;
        }
        .block-compact-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        }
        .block-card.compact .block-title-input {
            flex: 1; min-width: 120px; font-size: .9rem; font-weight: 500;
            padding: 4px 8px; margin-bottom: 0;
        }
        .block-card.compact .block-time-group { gap: 4px; }
        .block-card.compact .block-time-group label { font-size: 0; gap: 0; }
        .block-card.compact .block-time-group label span { display: none; }
        .block-card.compact .hht { padding: 5px 8px; gap: 3px; flex-shrink: 0; }
        .block-card.compact .hht-h {
            width: 2.4em; min-width: 36px; max-width: 44px;
            padding: 0 3px; font-size: .85rem;
            -moz-appearance: textfield; appearance: textfield;
        }
        .block-card.compact .hht-h::-webkit-outer-spin-button,
        .block-card.compact .hht-h::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .block-card.compact .hht-m { min-width: 30px; font-size: .82rem; padding: 2px 5px; }
        .block-card.compact .block-time-sep { padding-bottom: 0; font-size: .8rem; }
        .block-card.compact .block-meta-inline {
            font-size: .78rem; color: #7f8c8d; white-space: nowrap;
        }
        .block-card.compact .block-check-label { padding: 4px 8px; font-size: .78rem; }
        .block-card.compact .btn-small { padding: 3px 8px; font-size: .75rem; }
        .block-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .block-header-main { flex: 1; min-width: 0; }
        .block-title-input {
            width: 100%; font-size: 1rem; font-weight: 600; color: #2c3e50;
            border: 1px solid transparent; border-radius: 6px;
            padding: 6px 10px; background: transparent; margin-bottom: 4px;
        }
        .block-title-input:hover { border-color: #dce4ec; background: #fff; }
        .block-title-input:focus { border-color: #3498db; background: #fff; outline: none; box-shadow: 0 0 0 2px rgba(52,152,219,.15); }
        .block-title-input::placeholder { color: #bdc3c7; font-weight: 500; }
        .block-scores { flex-shrink: 0; text-align: right; white-space: nowrap; }
        .block-meta { font-size: .82rem; color: #7f8c8d; padding-left: 10px; }
        .block-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .badge {
            font-size: .72rem; padding: 2px 8px; border-radius: 10px; background: #ecf0f1; color: #555;
        }
        .badge.unclosed { background: #eee; color: #888; }
        .badge.milestone { background: #fef3c7; color: #b45309; }
        .badge.mainline { background: #dbeafe; color: #1d4ed8; }
        .score-display { font-size: .82rem; font-weight: 600; }
        .score-focus { color: #2563eb; }
        .score-progress { color: #ea580c; }
        .score-bars { display: inline-flex; gap: 2px; letter-spacing: -1px; }
        .time-axis { display: flex; height: 480px; margin-bottom: 12px; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
        .time-labels {
            width: 52px; flex-shrink: 0; background: #f8f9fa; border-right: 1px solid #eee;
            display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0;
        }
        .time-label { font-size: .7rem; color: #95a5a6; text-align: center; }
        .time-axis-grid { flex: 1; position: relative; background: #fff; }
        .time-axis-grid .hour-line {
            position: absolute; left: 0; right: 0; height: 1px; background: #f0f0f0;
        }
        .timeline-block {
            position: absolute; left: 8px; right: 8px; border-radius: 6px;
            background: #f1f5f9; border: 1px solid #e2e8f0; overflow: hidden; cursor: pointer;
            min-height: 20px;
        }
        .timeline-block.selected { box-shadow: 0 0 0 2px #3498db; z-index: 2; }
        .timeline-block .focus-bar {
            position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
        }
        .timeline-block .progress-bar {
            position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
        }
        .timeline-block .tb-content { padding: 4px 8px 6px 10px; font-size: .78rem; line-height: 1.3; }
        .timeline-block .tb-time { color: #64748b; }
        .timeline-block .tb-act { color: #1e293b; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-selector { display: flex; gap: 4px; }
        .score-btn {
            width: 36px; height: 36px; border: 2px solid #ddd; border-radius: 6px;
            background: #fff; cursor: pointer; font-weight: 600; font-size: .9rem; transition: all .15s;
        }
        .score-btn:hover { border-color: #3498db; }
        .score-btn.active { color: #fff; border-color: transparent; }
        .score-btn.focus.active { background: var(--c); }
        .score-btn.progress.active { background: var(--c); }
        .template-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .chip {
            font-size: .75rem; padding: 4px 10px; border-radius: 12px;
            background: #eef2ff; color: #4338ca; cursor: pointer; border: none;
        }
        .chip:hover { background: #c7d2fe; }
        .chip-output { background: #ecfdf5; color: #065f46; }
        .chip-output:hover { background: #a7f3d0; }
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
            z-index: 1000; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #fff; border-radius: 12px; max-width: 520px; width: 100%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2);
        }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 600; font-size: 1.05rem; }
        .modal-body { padding: 16px 20px; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 8px; }
        .life-section { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
        .life-section:last-child { border-bottom: none; margin-bottom: 0; }
        .life-section h4 { font-size: .88rem; color: #555; margin-bottom: 10px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .rating-row { display: flex; gap: 6px; align-items: center; }
        .rating-btn {
            width: 32px; height: 32px; border: 1px solid #ddd; border-radius: 6px;
            background: #fff; cursor: pointer; font-size: .85rem;
        }
        .rating-btn.active { background: #3498db; color: #fff; border-color: #3498db; }
        .empty-hint { text-align: center; color: #95a5a6; padding: 24px; font-size: .9rem; }
        .core-question-input { font-size: 1rem; font-weight: 500; }
        .block-details { font-size: .82rem; color: #555; margin-top: 8px; }
        .block-details div { margin-bottom: 4px; }
        .block-actions {
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
            margin-top: 12px; padding-top: 12px; border-top: 1px solid #e9ecef;
        }
        .block-time-group { display: flex; align-items: flex-end; gap: 8px; }
        .block-time-group label {
            display: flex; flex-direction: column; gap: 4px;
            font-size: .75rem; color: #7f8c8d;
        }
        .block-time-input {
            width: 120px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
            font-size: .9rem; font-family: inherit; background: #fff;
        }
        .block-time-input:focus { border-color: #3498db; outline: none; box-shadow: 0 0 0 2px rgba(52,152,219,.12); }
        .block-time-sep { color: #bdc3c7; font-size: .85rem; padding-bottom: 10px; }
        .block-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
        .block-check-label {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: .88rem; color: #555; padding: 6px 10px;
            background: #fff; border: 1px solid #e9ecef; border-radius: 6px; cursor: pointer;
        }
        .block-check-label input { width: 16px; height: 16px; cursor: pointer; }
        .hht {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
            background: #fff; font-family: inherit;
        }
        .hht-h {
            width: 2.4em; min-width: 36px; max-width: 44px;
            border: none; text-align: center; font-size: .9rem;
            background: transparent; outline: none; padding: 0 3px;
            -moz-appearance: textfield; appearance: textfield;
        }
        .hht-h::-webkit-outer-spin-button,
        .hht-h::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .hht-colon { color: #555; font-weight: 600; }
        .hht-m {
            min-width: 32px; padding: 2px 6px; border: 1px solid #e2e8f0; border-radius: 4px;
            background: #f8fafc; font-size: .9rem; cursor: pointer; font-family: inherit;
        }
        .hht-m:hover { background: #e0f2fe; border-color: #3498db; }
        .segment-list { max-height: 280px; overflow-y: auto; margin-top: 8px; border: 1px solid #eee; border-radius: 8px; }
        .segment-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: .85rem;
        }
        .segment-row:last-child { border-bottom: none; }
        .segment-row .seg-time { color: #64748b; min-width: 100px; font-family: monospace; }
        .segment-row .score-selector { gap: 3px; }
        .segment-row .score-btn { width: 28px; height: 28px; font-size: .8rem; }
        .segment-batch-bar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            padding: 10px; background: #f8fafc; border-radius: 8px; font-size: .82rem;
        }
        .segment-batch-bar input[type="number"] { width: 48px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; }
        .segment-batch-bar select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; }
        .seg-focus-strip { display: flex; gap: 2px; margin-top: 6px; height: 6px; border-radius: 3px; overflow: hidden; }
        .seg-focus-strip span { flex: 1; min-width: 4px; }
        .timeline-block .seg-bars { position: absolute; left: 0; top: 0; bottom: 3px; width: 4px; display: flex; flex-direction: column; }
        .timeline-block .seg-bars span { flex: 1; }
        .view-toggle { margin-bottom: 12px; }
        .legacy-note { font-size: .78rem; color: #95a5a6; margin-top: 8px; padding: 8px; background: #f8f9fa; border-radius: 6px; }
        .project-list { max-height: 360px; overflow-y: auto; }
        .project-list-item {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 10px 12px; border-bottom: 1px solid #f0f0f0;
        }
        .project-list-item:last-child { border-bottom: none; }
        .project-list-item .pj-name {
            flex: 1; font-size: .9rem; padding: 6px 8px; border: 1px solid transparent;
            border-radius: 6px; background: transparent;
        }
        .project-list-item .pj-name:hover { border-color: #dce4ec; background: #fff; }
        .project-list-item .pj-name:focus { border-color: #3498db; background: #fff; outline: none; }
        .project-list-item .pj-count { font-size: .78rem; color: #95a5a6; white-space: nowrap; min-width: 60px; text-align: right; }
        .project-list-empty { text-align: center; color: #95a5a6; padding: 24px; font-size: .9rem; }
        .project-select-row { display: flex; gap: 6px; align-items: stretch; }
        .project-select-row select { flex: 1; }
        .project-select-row .btn-manage { flex-shrink: 0; white-space: nowrap; padding: 6px 10px; font-size: .78rem; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="date-section">
            <div class="current-date" id="currentDate"></div>
            <div class="current-time" id="currentTime"></div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-outline" id="projectManageBtn">📂 管理项目</button>
            <button class="btn btn-primary" id="saveBtn">💾 保存到本地</button>
            <button class="btn btn-success" id="exportBtn">📤 导出 Markdown</button>
            <button class="btn btn-danger" id="clearBtn">🗑️ 清空今日</button>
        </div>
    </header>

    <main class="main-grid">
        <!-- 左上：时间记录 -->
        <section class="card" id="timeSection">
            <div class="card-header">
                <div class="card-title">⏰ 时间记录</div>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-primary btn-small" id="addBlockBtn">+ 添加时间段</button>
                    <button class="btn btn-outline btn-small" id="startWorkBtn">▶ 开始工作块</button>
                    <button class="btn btn-secondary btn-small" id="toggleViewBtn">📊 时间轴</button>
                </div>
            </div>
            <div class="card-body">
                <div class="time-axis" id="timeAxisView" style="display:none;">
                    <div class="time-labels" id="timeLabels"></div>
                    <div class="time-axis-grid" id="timeAxisGrid"></div>
                </div>
                <div id="blockListView"></div>
            </div>
        </section>

        <!-- 右上：今日主线 -->
        <section class="card" id="focusSection">
            <div class="card-header">
                <div class="card-title">🎯 今日主线</div>
                <button class="btn btn-primary btn-small" id="addTaskBtn">+ 关键任务</button>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>今日核心问题（最多 1 个）</label>
                    <input type="text" class="core-question-input" id="coreQuestion" placeholder="今天最想推进的核心问题是什么？">
                </div>
                <div id="taskList"></div>
            </div>
        </section>

        <!-- 左下：每日回顾 -->
        <section class="card" id="reflectionSection">
            <div class="card-header"><div class="card-title">📝 每日回顾</div></div>
            <div class="card-body">
                <div class="reflection-item">
                    <label>今日关键产出（1—3 条）</label>
                    <div id="keyOutputChips" style="margin-bottom:8px;"></div>
                    <textarea id="reflKeyOutputs" rows="4" placeholder="今天实际留下了什么？&#10;· 代码提交 / 实验图 / 论文草稿&#10;· 被排除的假设 / 确认的方向&#10;· 完成的关键决策"></textarea>
                </div>
                <div class="reflection-item">
                    <label>被卡住或搁置的事</label>
                    <textarea id="reflStuck" rows="3" placeholder="哪些工作块没有闭环？卡在了哪一步？"></textarea>
                </div>
                <div class="reflection-item">
                    <label>明天优先级</label>
                    <textarea id="reflTomorrow" rows="3" placeholder="明天第一步做什么？优先级最高的一件事是什么？"></textarea>
                </div>
                <div class="reflection-item">
                    <label>自由笔记（可选）</label>
                    <textarea id="reflExtra" class="refl-extra" rows="4" placeholder="任何想记下来的东西"></textarea>
                </div>
            </div>
        </section>

        <!-- 右下：指标与生活 -->
        <section class="card" id="metricsSection">
            <div class="card-header"><div class="card-title">📊 今日指标与生活状态</div></div>
            <div class="card-body">
                <h4 style="font-size:.9rem;margin-bottom:10px;color:#555;">工作指标</h4>
                <div class="metric-grid" id="metricGrid"></div>
                <div class="metric-hint" id="metricHint" style="display:none;"></div>

                <div class="life-section" style="margin-top:16px;">
                    <h4>😴 睡眠</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="bedTime">入睡</label>
                            <input type="time" id="bedTime">
                        </div>
                        <div class="form-group">
                            <label for="wakeTime">起床</label>
                            <input type="time" id="wakeTime">
                        </div>
                        <div class="form-group">
                            <label>睡眠时长</label>
                            <div id="sleepDuration" style="padding:8px 0;font-weight:600;color:#3498db;">—</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>睡眠质量（1—5）</label>
                        <div class="rating-row" id="sleepQualityRating"></div>
                    </div>
                </div>

                <div class="life-section">
                    <h4>🏃 运动</h4>
                    <div class="checkbox-row">
                        <input type="checkbox" id="exerciseDone">
                        <label for="exerciseDone">今日有运动</label>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exerciseDuration">时长（分钟）</label>
                            <input type="number" id="exerciseDuration" min="0" step="5">
                        </div>
                        <div class="form-group">
                            <label for="exerciseType">类型</label>
                            <select id="exerciseType">
                                <option value="">—</option>
                                <option value="拉伸">拉伸</option>
                                <option value="羽毛球">羽毛球</option>
                                <option value="足球">足球</option>
                                <option value="乒乓球">乒乓球</option>
                                <option value="跑步">跑步</option>
                                <option value="其他">其他（自定义）</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="exerciseTypeCustomWrap" style="display:none;margin-top:8px;">
                        <label for="exerciseTypeCustom">自定义类型</label>

    <script>
/* 科研日程记录表 V3 - 核心逻辑 */
(function () {
    'use strict';

    const SCHEMA_VERSION = 3;
    const STORAGE_KEY = 'efficiencyTrackerAllData';
    const SETTINGS_KEY = 'researchScheduleV3Settings';
    const SEGMENT_MINUTES = 30;
    const HOUR_START = 6;
    const HOUR_END = 24;
    const HOUR_SPAN = HOUR_END - HOUR_START;

    const FOCUS_COLORS = ['#E5E7EB', '#CBD5E1', '#93C5FD', '#3B82F6', '#1D4ED8'];
    const PROGRESS_COLORS = ['#E5E7EB', '#FDE68A', '#FDBA74', '#F97316', '#C2410C'];
    const FOCUS_LABELS = ['基本没有进入工作', '多次切换、断断续续', '有推进但受干扰', '大部分时间专注', '持续沉浸'];
    const PROGRESS_LABELS = ['无有效推进', '信息收集、仍模糊', '局部证据或排除', '不确定性明显减少', '关键结论/阶段节点'];
    const EVIDENCE_TEMPLATES = ['生成一张图', '完成一次代码提交', '排除一个假设', '写下论文结论', '完成一个决策', '复现一个错误', '明确下一步'];
    const EXERCISE_PRESETS = ['拉伸', '羽毛球', '足球', '乒乓球', '跑步'];

    const state = {
        date: new Date(),
        viewMode: 'list',
        selectedBlockId: null,
        timeBlocks: [],
        dailyFocus: { coreQuestion: '', tasks: [] },
        sleep: { bedTime: null, wakeTime: null, quality: null },
        life: {
            exercise: { done: false, durationMinutes: 0, type: '' },
            reading: { done: false, durationMinutes: 0, pages: null, takeaway: '' },
            energy: null,
            mood: null
        },
        reflection: { keyOutputs: '', stuckOrDropped: '', tomorrowPriority: '', extraNotes: '' },
        legacy: null,
        endWorkBlockId: null,
        pendingWorkBlockId: null,
        endWorkFocus: null,
        endWorkProgress: null,
        endWorkSegments: []
    };

    let settings = { projects: [] };

    // ========== 半点时间与子时段 ==========
    function timeToMinutes(t) {
        if (!t) return 0;
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
    }

    function minutesToTime(mins) {
        const m = ((mins % (24 * 60)) + 24 * 60) % (24 * 60);
        return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    function snapToHalfHour(timeStr) {
        if (!timeStr) return '09:00';
        const total = timeToMinutes(timeStr);
        const snapped = Math.round(total / SEGMENT_MINUTES) * SEGMENT_MINUTES;
        return minutesToTime(snapped);
    }

    function generateSegments(startTime, endTime, oldSegments) {
        startTime = snapToHalfHour(startTime);
        endTime = snapToHalfHour(endTime);
        let startM = timeToMinutes(startTime);
        let endM = timeToMinutes(endTime);
        if (endM <= startM) endM += 24 * 60;
        const oldMap = {};
        (oldSegments || []).forEach(s => { oldMap[s.startTime + '-' + s.endTime] = s.focusScore; });
        const segments = [];
        for (let cur = startM; cur < endM; cur += SEGMENT_MINUTES) {
            const segStart = minutesToTime(cur);
            const segEnd = minutesToTime(cur + SEGMENT_MINUTES);
            const key = segStart + '-' + segEnd;
            segments.push({
                startTime: segStart,
                endTime: segEnd,
                focusScore: oldMap[key] !== undefined ? oldMap[key] : null
            });
        }
        return segments;
    }

    function getSegmentFocus(block, seg) {
        if (seg.focusScore != null && seg.focusScore !== '') return Number(seg.focusScore);
        if (block.focusScore != null) return Number(block.focusScore);
        return null;
    }

    function computeBlockFocusAverage(block) {
        if (!block.segments || !block.segments.length) return null;
        let sum = 0, mins = 0;
        block.segments.forEach(seg => {
            if (seg.focusScore != null && seg.focusScore !== '') {
                sum += Number(seg.focusScore) * SEGMENT_MINUTES;
                mins += SEGMENT_MINUTES;
            }
        });
        return mins > 0 ? Math.round((sum / mins) * 100) / 100 : null;
    }

    function ensureBlockSegments(block) {
        if (!block.isWork || !block.startTime || !block.endTime) {
            block.segments = [];
            return;
        }
        block.startTime = snapToHalfHour(block.startTime);
        block.endTime = snapToHalfHour(block.endTime);
        block.segments = generateSegments(block.startTime, block.endTime, block.segments || []);
    }

    function normalizeBlock(block) {
        if (block.startTime) block.startTime = snapToHalfHour(block.startTime);
        if (block.endTime) block.endTime = snapToHalfHour(block.endTime);
        delete block.durationMinutes;
        if (block.isWork && block.startTime && block.endTime) {
            if (!block.segments || !block.segments.length) {
                block.segments = generateSegments(block.startTime, block.endTime, []);
                if (block.focusScore != null) {
                    block.segments.forEach(s => { s.focusScore = block.focusScore; });
                }
            } else {
                block.segments = generateSegments(block.startTime, block.endTime, block.segments);
            }
        } else if (!block.segments) {
            block.segments = [];
        }
    }

    function validateWorkBlockDuration(block) {
        if (!block.isWork || !block.endTime) return true;
        const dur = blockDurationMinutes(block);
        if (dur < SEGMENT_MINUTES) {
            alert('工作块最短 30 分钟，请调整结束时间');
            return false;
        }
        return true;
    }

    function halfHourTimeHtml(value, attrs) {
        const v = snapToHalfHour(value || '09:00');
        const [h, m] = v.split(':');
        return `<div class="hht" ${attrs || ''}><input type="number" class="hht-h" min="0" max="23" value="${h}"><span class="hht-colon">:</span><button type="button" class="hht-m">${m}</button></div>`;
    }

    function readHalfHourTime(wrap) {
        const h = Math.min(23, Math.max(0, parseInt(wrap.querySelector('.hht-h').value, 10) || 0));
        const m = wrap.querySelector('.hht-m').textContent;
        return String(h).padStart(2, '0') + ':' + m;
    }

    function bindHalfHourWrap(wrap, onChange) {
        const hInput = wrap.querySelector('.hht-h');
        const mBtn = wrap.querySelector('.hht-m');
        const emit = () => onChange(readHalfHourTime(wrap));
        hInput.addEventListener('change', emit);
        hInput.addEventListener('blur', () => {
            hInput.value = Math.min(23, Math.max(0, parseInt(hInput.value, 10) || 0));
            emit();
        });
        mBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            mBtn.textContent = mBtn.textContent === '00' ? '30' : '00';
            emit();
        });
    }

    function bindBlockHalfHourInputs() {
        document.querySelectorAll('.hht[data-block-id]').forEach(wrap => {
            if (wrap.dataset.bound) return;
            wrap.dataset.bound = '1';
            const id = wrap.dataset.blockId;
            const field = wrap.dataset.timeField;
            bindHalfHourWrap(wrap, (val) => {
                const b = state.timeBlocks.find(x => x.id === id);
                if (!b) return;
                const prev = b[field];
                b[field] = val;
                if (b.isWork && b.startTime && b.endTime && !validateWorkBlockDuration(b)) {
                    b[field] = prev;
                    renderBlockList();
                    return;
                }
                if (b.isWork) ensureBlockSegments(b);
                updateBlockMeta(id);
                renderMetrics();
                if (state.viewMode === 'timeline') renderTimeline();
                persist();
            });
        });
    }

    function segmentFocusStripHtml(block) {
        if (!block.isWork || !block.segments || !block.segments.length) return '';
        const parts = block.segments.map(seg => {
            const f = getSegmentFocus(block, seg);
            const c = f != null ? FOCUS_COLORS[f] : '#f1f5f9';
            return `<span style="background:${c}" title="${seg.startTime}-${seg.endTime} 专注${f ?? '?'}"></span>`;
        }).join('');
        return `<div class="seg-focus-strip">${parts}</div>`;
    }

    // ========== 纯函数：指标计算 ==========
    function getWorkBlocks(blocks) {
        return blocks.filter(b => b.isWork);
    }

    function blockDurationMinutes(block) {
        if (!block.startTime || !block.endTime) return 0;
        let mins = timeToMinutes(block.endTime) - timeToMinutes(block.startTime);
        if (mins <= 0) mins += 24 * 60;
        return mins;
    }

    function formatBlockDuration(mins) {
        if (!mins) return '0分钟';
        const h = Math.floor(mins / 60), m = mins % 60;
        if (h && m) return h + '小时' + m + '分钟';
        if (h) return h + '小时';
        return m + '分钟';
    }

    function isClosed(block) {
        return !!(String(block.evidence || '').trim() && String(block.nextStep || '').trim());
    }

    function calcMetrics(blocks) {
        const work = getWorkBlocks(blocks);
        const totalWorkMins = work.reduce((s, b) => s + blockDurationMinutes(b), 0);

        let focusWeightedSum = 0, focusWeightedDenom = 0, scoredFocusMins = 0;
        let deepMins = 0, fragmentMins = 0, idleMins = 0;
        let effectiveMins = 0, highQualityMins = 0;

        work.forEach(b => {
            ensureBlockSegments(b);
            const prog = b.progressScore;
            (b.segments || []).forEach(seg => {
                const focus = getSegmentFocus(b, seg);
                if (focus == null) return;
                focusWeightedSum += SEGMENT_MINUTES * focus;
                focusWeightedDenom += SEGMENT_MINUTES * 4;
                scoredFocusMins += SEGMENT_MINUTES;
                if (focus >= 3) deepMins += SEGMENT_MINUTES;
                if (focus <= 1) fragmentMins += SEGMENT_MINUTES;
                if (prog != null) {
                    if (focus >= 3 && prog >= 3) highQualityMins += SEGMENT_MINUTES;
                    if (focus >= 3 && prog >= 2) effectiveMins += SEGMENT_MINUTES;
                    if (focus >= 3 && prog <= 1) idleMins += SEGMENT_MINUTES;
                }
            });
        });

        let progressWeightedSum = 0, progressWeightedDenom = 0, scoredProgressMins = 0;
        let highProgressMins = 0;
        work.forEach(b => {
            if (b.progressScore == null) return;
            const mins = blockDurationMinutes(b);
            progressWeightedSum += mins * b.progressScore;
            progressWeightedDenom += mins * 4;
            scoredProgressMins += mins;
            if (b.progressScore >= 3) highProgressMins += mins;
        });

        const focusIndex = focusWeightedDenom > 0 ? (focusWeightedSum / focusWeightedDenom) * 100 : null;
        const progressIndex = progressWeightedDenom > 0 ? (progressWeightedSum / progressWeightedDenom) * 100 : null;

        const closed = work.filter(isClosed);
        const closureRate = work.length > 0 ? (closed.length / work.length) * 100 : null;
        const closedMainline = closed.filter(b => b.isMainline);
        const mainlineRate = closed.length > 0 ? (closedMainline.length / closed.length) * 100 : null;

        const withExpected = work.filter(b => String(b.expectedEvidence || '').trim());
        let evidenceRate = null;
        if (withExpected.length > 0) {
            let score = 0;
            withExpected.forEach(b => {
                const st = b.evidenceStatus || (b.evidence ? 'yes' : 'no');
                if (st === 'yes') score += 1;
                else if (st === 'partial') score += 0.5;
            });
            evidenceRate = (score / withExpected.length) * 100;
        }

        return {
            totalWorkHours: totalWorkMins / 60,
            deepWorkHours: deepMins / 60,
            highProgressHours: highProgressMins / 60,
            effectiveWorkHours: effectiveMins / 60,
            highQualityHours: highQualityMins / 60,
            idleHours: idleMins / 60,
            fragmentHours: fragmentMins / 60,
            focusIndex,
            progressIndex,
            closureRate,
            evidenceRate,
            mainlineRate,
            researchLoops: closed.length,
            milestones: work.filter(b => b.isMilestone).length,
            scoredRatio: totalWorkMins > 0 ? scoredFocusMins / totalWorkMins : 0,
            workBlockCount: work.length
        };
    }

    // 验收: 3h块，前2段专注4后4段专注1，推进3 => 深度1h，专注指数 (120*4+240*1)/(360*4)=50%
    function _runMetricTests() {
        const block = {
            isWork: true, startTime: '14:00', endTime: '17:00', progressScore: 3,
            evidence: 'x', nextStep: 'y', focusScore: 2,
            segments: [
                { startTime: '14:00', endTime: '14:30', focusScore: 4 },
                { startTime: '14:30', endTime: '15:00', focusScore: 4 },
                { startTime: '15:00', endTime: '15:30', focusScore: 1 },
                { startTime: '15:30', endTime: '16:00', focusScore: 1 },
                { startTime: '16:00', endTime: '16:30', focusScore: 1 },
                { startTime: '16:30', endTime: '17:00', focusScore: 1 }
            ]
        };
        const t = calcMetrics([block]);
        console.assert(Math.abs(t.totalWorkHours - 3) < 0.01, 'totalWorkHours');
        console.assert(Math.abs(t.deepWorkHours - 1) < 0.01, 'deepWorkHours');
        console.assert(Math.abs(t.focusIndex - 50) < 0.5, 'focusIndex');
        console.assert(Math.abs(t.progressIndex - 75) < 0.5, 'progressIndex');
    }

    // ========== 工具函数 ==========
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function getTodayKey() { return state.date.toISOString().split('T')[0]; }
    function escapeHtml(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function formatTime(d) {
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function formatHours(h) {
        if (h == null || isNaN(h)) return '—';
        return (Math.round(h * 10) / 10).toFixed(1) + ' h';
    }
    function formatPct(v) {
        if (v == null || isNaN(v)) return '—';
        return Math.round(v) + '%';
    }
    function calcSleepMinutes(bed, wake) {
        if (!bed || !wake) return 0;
        const [bh, bm] = bed.split(':').map(Number);
        const [wh, wm] = wake.split(':').map(Number);
        let mins = (wh * 60 + wm) - (bh * 60 + bm);
        if (mins <= 0) mins += 24 * 60;
        return mins;
    }
    function formatSleepDisplay(mins) {
        if (!mins) return '—';
        const h = Math.floor(mins / 60), m = mins % 60;
        if (h && m) return h + '小时' + m + '分钟';
        if (h) return h + '小时';
        return m + '分钟';
    }
    function getProjectName(id) {
        if (!id) return '';
        const p = settings.projects.find(x => x.id === id);
        return p ? p.name : (id + '（已删除）');
    }
    function ensureProject(name) {
        const n = String(name || '').trim();
        if (!n) return '';
        let p = settings.projects.find(x => x.name === n);
        if (!p) {
            p = { id: uid(), name: n };
            settings.projects.push(p);
            saveSettings();
        }
        return p.id;
    }
    function countProjectUsage(projectId) {
        let count = 0;
        state.timeBlocks.forEach(b => { if (b.projectId === projectId) count++; });
        state.dailyFocus.tasks.forEach(t => { if (t.projectId === projectId) count++; });
        return count;
    }
    function renderProjectList() {
        const el = document.getElementById('projectList');
        if (!el) return;
        if (!settings.projects.length) {
            el.innerHTML = '<div class="project-list-empty">暂无项目，在上方输入名称添加</div>';
            return;
        }
        el.innerHTML = settings.projects.map(p => {
            const usage = countProjectUsage(p.id);
            return `<div class="project-list-item">
                <input type="text" class="pj-name" value="${escapeHtml(p.name)}" data-pid="${p.id}" onchange="App.updateProjectName('${p.id}', this.value)">
                <span class="pj-count">${usage} 处引用</span>
                <button class="btn btn-danger btn-small" onclick="App.deleteProject('${p.id}')" title="删除项目">🗑</button>
            </div>`;
        }).join('');

    function openProjectManager() {
        renderProjectList();
        document.getElementById('projectManageModal').classList.add('show');
    }
    function addProjectFromInput() {
        const inp = document.getElementById('newProjectName');
        const name = inp.value.trim();
        if (!name) { alert('请输入项目名称'); return; }
        if (settings.projects.find(p => p.name === name)) {
            alert('该项目已存在');
            return;
        }
        settings.projects.push({ id: uid(), name: name });
        saveSettings();
        inp.value = '';
        renderProjectList();
        renderAll();
    }
    function updateProjectName(id, newName) {
        const n = String(newName || '').trim();
        if (!n) { alert('项目名称不能为空'); renderProjectList(); return; }
        const dup = settings.projects.find(p => p.name === n && p.id !== id);
        if (dup) { alert('该项目名已存在'); renderProjectList(); return; }
        const p = settings.projects.find(x => x.id === id);
        if (p) { p.name = n; saveSettings(); }
        renderAll();
    }
    function deleteProject(id) {
        const p = settings.projects.find(x => x.id === id);
        if (!p) return;
        const usage = countProjectUsage(id);
        const msg = usage > 0
            ? `项目「${p.name}」正被 ${usage} 处记录引用，删除后这些记录将显示为已删除。\n\n确定删除？`
            : `确定删除项目「${p.name}」？`;
        if (!confirm(msg)) return;
        settings.projects = settings.projects.filter(x => x.id !== id);
        saveSettings();
        renderProjectList();
        renderAll();
    }

    // ========== 存储 ==========
    function getAllData() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
    }
    function saveAllData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function loadSettings() {
        try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch { settings = {}; }
        if (!settings.projects) settings.projects = [];
    }
    function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

    function migrateDayData(raw) {
        if (!raw) return null;
        if (raw.schemaVersion === 3) {
            (raw.timeBlocks || []).forEach(b => {
                if (b.id != null) b.id = String(b.id);
                normalizeBlock(b);
            });
            return raw;
        }
        if (raw.schemaVersion === 2) {
            raw.schemaVersion = 3;
            (raw.timeBlocks || []).forEach(b => {
                if (b.id != null) b.id = String(b.id);
                if (!b.segments) b.segments = [];
                normalizeBlock(b);
            });
            return raw;
        }

        const migrated = {
            schemaVersion: 3,
            timeBlocks: [],
            dailyFocus: { coreQuestion: '', tasks: [] },
            sleep: { bedTime: null, wakeTime: null, quality: null },
            life: {
                exercise: { done: false, durationMinutes: 0, type: '' },
                reading: { done: false, durationMinutes: 0, pages: null, takeaway: '' },
                energy: null, mood: null
            },
            reflection: { keyOutputs: '', stuckOrDropped: '', tomorrowPriority: '', extraNotes: '' },
            viewMode: raw.viewMode || 'list',
            lastSaved: raw.lastSaved || new Date().toISOString(),
            legacy: {}
        };

        if (raw.timeBlocks) {
            migrated.timeBlocks = raw.timeBlocks.map(b => ({
                id: String(b.id),
                startTime: b.startTime || '',
                endTime: b.endTime || '',
                title: b.activity || b.title || '',
                isWork: false,
                projectId: '',
                question: '',
                expectedEvidence: '',
                evidence: '',
                nextStep: '',
                focusScore: null,
                progressScore: null,
                loopTypes: [],
                isMainline: false,
                isMilestone: false,
                notes: '',
                segments: [],
                legacyTags: b.tags || []
            }));
            migrated.timeBlocks.forEach(normalizeBlock);
        }

        if (raw.tasks) {
            migrated.dailyFocus.tasks = raw.tasks.slice(0, 3).map(t => ({
                id: String(t.id),
                projectId: '',
                title: t.text || '',
                expectedEvidence: '',
                isMainline: false,
                completed: !!t.completed,
                linkedBlockIds: []
            }));
        }

        if (raw.notes) migrated.reflection.extraNotes = raw.notes;

        if (raw.sleepData) {
            migrated.sleep.bedTime = raw.sleepData.bedtime || raw.sleepData.bedTime || null;
            migrated.sleep.wakeTime = raw.sleepData.wakeupTime || raw.sleepData.wakeTime || null;
        }

        if (raw.lifeDensityData) {
            migrated.legacy.scores = raw.lifeDensityData;
        }
        if (raw.lifeDensityData && raw.lifeDensityData.workHours) {
            migrated.legacy.workHours = raw.lifeDensityData.workHours;
        }

        return migrated;
    }

    function migrateReflection(refl) {
        if (!refl) return { keyOutputs: '', stuckOrDropped: '', tomorrowPriority: '', extraNotes: '' };
        // Already migrated
        if ('keyOutputs' in refl) return refl;
        // Migrate from old format (v3.0 / v3.1)
        return {
            keyOutputs: [refl.clarified || ''].filter(Boolean).join('\n'),
            stuckOrDropped: refl.timeWithoutEvidence || '',
            tomorrowPriority: refl.tomorrowEntry || '',
            extraNotes: refl.extraNotes || ''
        };
    }

    function migrateOldStorage() {
        const old = localStorage.getItem('efficiencyTrackerData');
        if (!old) return;
        try {
            const data = JSON.parse(old);
            const key = getTodayKey();
            const all = getAllData();
            if (!all[key]) {
                all[key] = migrateDayData(data);
                saveAllData(all);
            }
            localStorage.removeItem('efficiencyTrackerData');
        } catch (e) { console.error(e); }
    }

    function persist() {
        const key = getTodayKey();
        const all = getAllData();
        all[key] = {
            schemaVersion: SCHEMA_VERSION,
            timeBlocks: state.timeBlocks,
            dailyFocus: state.dailyFocus,
            sleep: state.sleep,
            life: state.life,
            reflection: state.reflection,
            viewMode: state.viewMode,
            legacy: state.legacy,
            lastSaved: new Date().toISOString()
        };
        saveAllData(all);
    }

    function loadDay() {
        migrateOldStorage();
        const raw = getAllData()[getTodayKey()];
        if (!raw) return;
        const data = migrateDayData(raw);
        state.timeBlocks = data.timeBlocks || [];
        state.timeBlocks.forEach(normalizeBlock);
        state.dailyFocus = data.dailyFocus || { coreQuestion: '', tasks: [] };
        state.sleep = data.sleep || state.sleep;
        if (state.sleep.targetBedTime != null) delete state.sleep.targetBedTime;
        if (state.sleep.quality == null) state.sleep.quality = null;
        state.life = data.life || state.life;
        state.reflection = migrateReflection(data.reflection);
        state.viewMode = data.viewMode || 'list';
        state.legacy = data.legacy || null;
    }

    // ========== 时间块 CRUD ==========
    function createBlock(opts = {}) {
        const start = snapToHalfHour(opts.startTime || formatTime(new Date()));
        const block = {
            id: uid(),
            startTime: start,
            endTime: opts.endTime ? snapToHalfHour(opts.endTime) : '',
            title: opts.title || '',
            isWork: !!opts.isWork,
            projectId: opts.projectId || '',
            question: opts.question || '',
            expectedEvidence: opts.expectedEvidence || '',
            evidence: '',
            nextStep: '',
            focusScore: null,
            progressScore: null,
            loopTypes: [],
            isMainline: false,
            isMilestone: false,
            notes: '',
            plannedMinutes: opts.plannedMinutes || null,
            segments: []
        };
        if (block.isWork && block.endTime) ensureBlockSegments(block);
        return block;
    }

    function addBlock(isWork = false) {
        state.timeBlocks.push(createBlock({ isWork }));
        renderAll();
        persist();
    }

    function removeBlock(id) {
        if (!confirm('确定删除此时间块？关联任务链接将解除。')) return;
        state.timeBlocks = state.timeBlocks.filter(b => b.id !== id);
        state.dailyFocus.tasks.forEach(t => {
            t.linkedBlockIds = (t.linkedBlockIds || []).filter(bid => bid !== id);
        });
        if (state.selectedBlockId === id) state.selectedBlockId = null;
        renderAll();
        persist();
    }

    function updateBlock(id, field, value, silent) {
        const b = state.timeBlocks.find(x => x.id === id);
        if (!b) return;
        if (field === 'startTime' || field === 'endTime') {
            value = snapToHalfHour(value);
            const prev = b[field];
            b[field] = value;
            if (b.isWork && b.startTime && b.endTime && !validateWorkBlockDuration(b)) {
                b[field] = prev;
                if (!silent) renderAll();
                return;
            }
            if (b.isWork) ensureBlockSegments(b);
            updateBlockMeta(id);
        } else {
            b[field] = value;
        }
        if (!silent) renderAll();
        persist();
    }

    function updateBlockSilent(id, field, value) {
        updateBlock(id, field, value, true);
    }

    function updateBlockMeta(id) {
        const b = state.timeBlocks.find(x => x.id === id);
        const card = document.querySelector(`.block-card[data-id="${id}"]`);
        if (!b || !card) return;
        const durText = formatBlockDuration(blockDurationMinutes(b));
        const meta = card.querySelector('.block-meta');
        if (meta) {
            let text = `${b.startTime}${b.endTime ? ' – ' + b.endTime : '（进行中）'} · ${durText}`;
            if (b.isWork) text += ` · ${getProjectName(b.projectId)}`;
            meta.textContent = text;
        }
        const inline = card.querySelector('.block-meta-inline');
        if (inline) inline.textContent = durText;
    }

    function selectBlock(id) {
        state.selectedBlockId = id;
        renderAll();
    }

            alert('关键任务最多 3 个');
            return;
        }
        state.dailyFocus.tasks.push({

        });

        persist();

    // ========== 评分选择器 ==========
    function buildScoreSelector(containerId, type, initial, onChange) {
        const el = document.getElementById(containerId);
        if (!el) return;
        el.innerHTML = '';
        const colors = type === 'focus' ? FOCUS_COLORS : PROGRESS_COLORS;
        for (let i = 0; i <= 4; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'score-btn ' + type + (initial === i ? ' active' : '');
            btn.textContent = i;
            btn.style.setProperty('--c', colors[i]);
            btn.title = (type === 'focus' ? FOCUS_LABELS : PROGRESS_LABELS)[i];
            btn.onclick = () => {
                el.querySelectorAll('.score-btn').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                onChange(i);
            };
            el.appendChild(btn);
        }
    }

        const el = document.getElementById(containerId);
        if (!el) return;
        el.innerHTML = '';
        EVIDENCE_TEMPLATES.forEach(t => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip';
            chip.textContent = t;
            chip.onclick = () => {
                const inp = document.getElementById(targetInputId);
                if (inp) inp.value = t;
            };
            el.appendChild(chip);
        });

    function focusBarHtml(score) {
        if (score == null) return '';
        const c = FOCUS_COLORS[score] || '#E5E7EB';
        return `<span class="score-bars" title="专注 ${score}/4">${'■'.repeat(score)}${'□'.repeat(4 - score)}</span>`;
    }

    function blockTypeLabel(block) {
        if (block.progressScore == null) return '';
        const avg = computeBlockFocusAverage(block);
        const f = avg != null ? avg : block.focusScore;
        if (f == null) return '';
        const p = block.progressScore;
        if (f >= 3 && p >= 3) return 'A 高专注高推进';
        if (f >= 3 && p <= 1) return 'B 高专注低推进';
        if (f <= 1 && p >= 3) return 'C 低专注高推进';
        if (f <= 1 && p <= 1) return 'D 低专注低推进';
        return '';
    }

    function renderTimeline() {
        const labels = document.getElementById('timeLabels');
        const grid = document.getElementById('timeAxisGrid');
        labels.innerHTML = '';
        for (let h = HOUR_START; h <= HOUR_END; h += 2) {
            const d = document.createElement('div');
            d.className = 'time-label';
            d.textContent = String(h).padStart(2, '0') + ':00';
            labels.appendChild(d);
        }
        grid.innerHTML = '';
        for (let i = 0; i <= HOUR_SPAN; i++) {
            const line = document.createElement('div');
            line.className = 'hour-line';
            line.style.top = (i / HOUR_SPAN * 100) + '%';
            grid.appendChild(line);
        }

        state.timeBlocks.forEach(b => {
            if (!b.startTime) return;
            const [sh, sm] = b.startTime.split(':').map(Number);
            let [eh, em] = b.endTime ? b.endTime.split(':').map(Number) : [sh + 1, sm];
            if (!b.endTime) { eh = sh + 1; em = sm; }
            let startM = sh * 60 + sm, endM = eh * 60 + em;
            if (endM <= startM) endM += 24 * 60;
            const base = HOUR_START * 60;
            const top = ((startM - base) / (HOUR_SPAN * 60)) * 100;
            const height = Math.max(((endM - startM) / (HOUR_SPAN * 60)) * 100, 2);

            const el = document.createElement('div');
            el.className = 'timeline-block' + (state.selectedBlockId === b.id ? ' selected' : '');
            el.style.top = top + '%';
            el.style.height = height + '%';
            if (b.isWork && b.segments && b.segments.length) {
                const barWrap = document.createElement('div');
                barWrap.className = 'seg-bars';
                b.segments.forEach(seg => {
                    const f = getSegmentFocus(b, seg);
                    const span = document.createElement('span');
                    span.style.background = f != null ? FOCUS_COLORS[f] : '#f1f5f9';
                    span.title = `${seg.startTime}-${seg.endTime} 专注${f ?? '?'}`;
                    barWrap.appendChild(span);
                });
                el.appendChild(barWrap);
            } else if (b.isWork && b.focusScore != null) {
                const fb = document.createElement('div');
                fb.className = 'focus-bar';
                fb.style.background = FOCUS_COLORS[b.focusScore];
                el.appendChild(fb);
            }
            if (b.isWork && b.progressScore != null) {
                const pb = document.createElement('div');
                pb.className = 'progress-bar';
                pb.style.background = PROGRESS_COLORS[b.progressScore];
                el.appendChild(pb);
            }
            const content = document.createElement('div');
            content.className = 'tb-content';
            content.innerHTML = `<div class="tb-time">${escapeHtml(b.startTime)}-${escapeHtml(b.endTime || '?')}</div><div class="tb-act">${escapeHtml(b.title || '未命名')}</div>`;
            el.appendChild(content);
            el.title = (b.isWork ? `专注${b.focusScore ?? '?'}/4 推进${b.progressScore ?? '?'}/4\n` : '') + (b.evidence || '');
            el.onclick = () => selectBlock(b.id);
            el.ondblclick = () => { if (b.isWork) openEndWork(b.id); };
            grid.appendChild(el);
        });
    }

    function taskProjectHtml(taskId, selectedId) {
        const prefix = 'tp_' + taskId;
        let html = `<div class="project-select-row">`;
        html += `<select id="${prefix}_sel" style="padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.9rem;">`;
        html += `<option value="">— 选择项目 —</option>`;
        settings.projects.forEach(p => {
            html += `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`;
        });
        html += `<option value="__new__">+ 新建项目</option></select>`;
        html += `<input type="text" id="${prefix}_txt" placeholder="输入新项目名称" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:.9rem;${selectedId && !settings.projects.find(p => p.id === selectedId) ? '' : 'display:none;'}">`;
        html += `<button type="button" class="btn btn-outline btn-manage" onclick="App.openProjectManager()" title="管理项目">⚙</button>`;

    function bindTaskProjectSelects() {
        state.dailyFocus.tasks.forEach(t => {
            const prefix = 'tp_' + t.id;
            const sel = document.getElementById(prefix + '_sel');
            const txt = document.getElementById(prefix + '_txt');
            if (!sel) return;
            sel.onchange = () => {
                if (sel.value === '__new__') {
                    txt.style.display = 'block';
                    txt.focus();
                    txt.value = '';
                } else {
                    txt.style.display = 'none';
                    txt.value = '';
                    t.projectId = sel.value;
                    persist();
                }
            };
            txt.onchange = () => {
                const name = txt.value.trim();
                if (name) {
                    t.projectId = ensureProject(name);
                    saveSettings();
                    renderTasks();
                } else {
                    t.projectId = '';
                    persist();
                }
            };
            txt.onblur = () => {
                if (sel.value === '__new__' && !txt.value.trim()) {
                    txt.style.display = 'none';
                }
            };
        });
    }

                return `<button type="button" class="chip chip-output" data-evidence="${escapeHtml(b.evidence || '')}" data-title="${escapeHtml(b.title || '')}">${escapeHtml(label)}</button>`;

    // ========== 工作块流程 ==========
    function renderEndWorkSegments() {
        const list = document.getElementById('ewSegmentList');
        const segs = state.endWorkSegments;
        if (!list || !segs) return;
        document.getElementById('ewBatchFrom').max = segs.length;
        document.getElementById('ewBatchTo').max = segs.length;
        document.getElementById('ewBatchTo').value = segs.length;
        list.innerHTML = segs.map((seg, i) =>
            `<div class="segment-row"><span class="seg-time">${seg.startTime}–${seg.endTime}</span><div class="score-selector" id="ewSegFocus${i}"></div></div>`
        ).join('');
        segs.forEach((seg, i) => {
            buildScoreSelector('ewSegFocus' + i, 'focus', seg.focusScore, v => {
                state.endWorkSegments[i].focusScore = v;
                refreshEndWorkFocusLabel();
            });
        });
    }

    function refreshEndWorkFocusLabel() {
        let sum = 0, n = 0;
        state.endWorkSegments.forEach(seg => {
            if (seg.focusScore != null) { sum += seg.focusScore; n++; }
        });
        const segAvg = n > 0 ? (Math.round((sum / n) * 100) / 100) : null;
        const el = document.getElementById('ewFocusLabel');
        if (!el) return;
        const base = state.endWorkFocus != null ? `整体 ${state.endWorkFocus}/4` : '整体未评';
        el.textContent = base + (segAvg != null ? ` · 已评子段均值 ${segAvg}` : '');
    }

    function regenEndWorkSegmentsFromEndTime(endTime) {
        const b = state.timeBlocks.find(x => x.id === state.endWorkBlockId);
        if (!b) return;
        endTime = snapToHalfHour(endTime);
        const old = state.endWorkSegments;
        state.endWorkSegments = generateSegments(b.startTime, endTime, old);
        renderEndWorkSegments();
    }

    function openStartWork() {
        state.pendingWorkBlockId = null;
        const wrap = document.getElementById('swStartWrap');
        wrap.innerHTML = halfHourTimeHtml(formatTime(new Date()), 'id="swStartHht"');
        bindHalfHourWrap(wrap.querySelector('.hht'), () => {});
        document.getElementById('swTitle').value = '';
        document.getElementById('swQuestion').value = '';
        document.getElementById('swExpected').value = '';
        document.getElementById('swPlanned').value = '';
        renderProjectSelect('swProjectWrap', '', 'swProject');
        buildTemplateChips('swExpectedChips', 'swExpected');
        document.getElementById('startWorkModal').classList.add('show');
    }

    function confirmStartWork() {
        const isEdit = !!state.pendingWorkBlockId;
        const block = isEdit
            ? state.timeBlocks.find(x => x.id === state.pendingWorkBlockId)
            : createBlock({ isWork: true });
        if (!block) return;
        block.isWork = true;
        block.startTime = readHalfHourTime(document.getElementById('swStartWrap').querySelector('.hht'));
        block.title = document.getElementById('swTitle').value;
        block.projectId = readProjectFrom('swProjectWrap', 'swProject');
        block.question = document.getElementById('swQuestion').value;
        block.expectedEvidence = document.getElementById('swExpected').value;
        block.plannedMinutes = parseInt(document.getElementById('swPlanned').value, 10) || null;
        if (!isEdit) state.timeBlocks.push(block);
        state.pendingWorkBlockId = null;
        document.getElementById('startWorkModal').classList.remove('show');
        selectBlock(block.id);
        renderAll();
        persist();
    }

    function toggleWork(id, isWork) {
        const b = state.timeBlocks.find(x => x.id === id);
        if (!b) return;
        if (!isWork) {
            b.isWork = false;
            b.segments = [];
            renderAll();
            persist();
            return;
        }
        b.isWork = true;
        state.pendingWorkBlockId = id;
        const swWrap = document.getElementById('swStartWrap');
        swWrap.innerHTML = halfHourTimeHtml(b.startTime || formatTime(new Date()), 'id="swStartHht"');
        bindHalfHourWrap(swWrap.querySelector('.hht'), () => {});
        document.getElementById('swTitle').value = b.title || '';
        document.getElementById('swQuestion').value = b.question || '';
        document.getElementById('swExpected').value = b.expectedEvidence || '';
        document.getElementById('swPlanned').value = b.plannedMinutes || '';
        renderProjectSelect('swProjectWrap', b.projectId || '', 'swProject');
        buildTemplateChips('swExpectedChips', 'swExpected');
        document.getElementById('startWorkModal').classList.add('show');
    }

    function openEndWork(id) {
        state.endWorkBlockId = id;
        const b = state.timeBlocks.find(x => x.id === id);
        if (!b) return;
        const endVal = snapToHalfHour(b.endTime || formatTime(new Date()));
        const ewWrap = document.getElementById('ewEndWrap');
        ewWrap.innerHTML = halfHourTimeHtml(endVal, 'id="ewEndHht"');
        bindHalfHourWrap(ewWrap.querySelector('.hht'), (val) => {
            if (!validateWorkBlockDuration({ ...b, endTime: val })) return;
            regenEndWorkSegmentsFromEndTime(val);
        });
        b.endTime = endVal;
        ensureBlockSegments(b);
        state.endWorkSegments = JSON.parse(JSON.stringify(b.segments || []));
        document.getElementById('ewEvidence').value = b.evidence || '';
        document.getElementById('ewNextStep').value = b.nextStep || '';
        document.getElementById('ewNotes').value = b.notes || '';
        document.getElementById('ewMainline').checked = b.isMainline;
        document.getElementById('ewMilestone').checked = b.isMilestone;
        document.getElementById('ewLoopPrimary').value = (b.loopTypes && b.loopTypes[0]) || '';
        document.getElementById('ewLoopSecondary').value = (b.loopTypes && b.loopTypes[1]) || '';
        state.endWorkFocus = b.focusScore;
        state.endWorkProgress = b.progressScore;
        buildScoreSelector('ewFocusSelector', 'focus', b.focusScore, v => {
            state.endWorkFocus = v;
            refreshEndWorkFocusLabel();
        });
        buildScoreSelector('ewProgressSelector', 'progress', b.progressScore, v => {
            state.endWorkProgress = v;
            document.getElementById('ewProgressLabel').textContent = '推进 ' + v + '/4 · ' + PROGRESS_LABELS[v];
            document.getElementById('ewMilestoneRow').style.display = v >= 4 ? 'flex' : 'none';
        });
        if (b.focusScore != null) {
            document.getElementById('ewFocusLabel').textContent = '整体 ' + b.focusScore + '/4 · ' + FOCUS_LABELS[b.focusScore];
        }
        buildTemplateChips('ewEvidenceChips', 'ewEvidence');
        renderEndWorkSegments();
        refreshEndWorkFocusLabel();
        document.getElementById('endWorkModal').classList.add('show');
    }

    function confirmEndWork() {
        const b = state.timeBlocks.find(x => x.id === state.endWorkBlockId);
        if (!b) return;
        const evidence = document.getElementById('ewEvidence').value.trim();
        const nextStep = document.getElementById('ewNextStep').value.trim();
        let progress = state.endWorkProgress;
        const focus = state.endWorkFocus;
        const endTime = readHalfHourTime(document.getElementById('ewEndWrap').querySelector('.hht'));

        if (progress == null) {
            alert('请填写推进程度');
            return;
        }
        const hasSegFocus = state.endWorkSegments.some(s => s.focusScore != null);
        if (focus == null && !hasSegFocus) {
            alert('请填写整体专注或至少一个子时段专注');
            return;
        }
        if (!evidence && progress > 1) {
            alert('未填写实际证据时，推进程度最高为 1');
            return;
        }
        if (progress >= 2 && !evidence) {
            alert('推进程度 ≥ 2 时必须填写实际证据');
            return;
        }
        b.endTime = endTime;
        if (!validateWorkBlockDuration(b)) return;

        b.evidence = evidence;
        b.nextStep = nextStep;
        b.focusScore = focus;
        b.progressScore = progress;
        b.segments = JSON.parse(JSON.stringify(state.endWorkSegments));
        b.isMainline = document.getElementById('ewMainline').checked;
        b.isMilestone = progress >= 4 && document.getElementById('ewMilestone').checked;
        b.notes = document.getElementById('ewNotes').value;
        const primary = document.getElementById('ewLoopPrimary').value;
        const secondary = document.getElementById('ewLoopSecondary').value;
        b.loopTypes = [primary, secondary].filter(Boolean);
        ensureBlockSegments(b);
        const avg = computeBlockFocusAverage(b);
        if (avg != null && focus == null) b.focusScore = avg;
        if (evidence) {
            b.evidenceStatus = b.expectedEvidence ? (evidence.includes(b.expectedEvidence.slice(0, 4)) ? 'partial' : 'yes') : 'yes';
        }

        document.getElementById('endWorkModal').classList.remove('show');
        renderAll();
        persist();
    }

    // ========== Markdown 导出 ==========
    function generateMarkdown() {
        const dateStr = getTodayKey();
        const weekday = ['日', '一', '二', '三', '四', '五', '六'][state.date.getDay()];
        const m = calcMetrics(state.timeBlocks);
        const sm = calcSleepMinutes(state.sleep.bedTime, state.sleep.wakeTime);

        let md = `---
date: ${dateStr}
schema_version: 3
total_work_hours: ${(m.totalWorkHours || 0).toFixed(1)}
deep_work_hours: ${(m.deepWorkHours || 0).toFixed(1)}
high_quality_hours: ${(m.highQualityHours || 0).toFixed(1)}
focus_index: ${m.focusIndex != null ? Math.round(m.focusIndex) : 'null'}
progress_index: ${m.progressIndex != null ? Math.round(m.progressIndex) : 'null'}
closure_rate: ${m.closureRate != null ? Math.round(m.closureRate) : 'null'}
research_loops: ${m.researchLoops}
milestones: ${m.milestones}
sleep_hours: ${(sm / 60).toFixed(1)}
sleep_quality: ${state.sleep.quality ?? 'null'}
energy: ${state.life.energy ?? 'null'}
mood: ${state.life.mood ?? 'null'}
---

# ${dateStr} 日程记录

## 今日核心问题

${state.dailyFocus.coreQuestion || '（未填写）'}

## 工作块

`;
        getWorkBlocks(state.timeBlocks).forEach(b => {
            md += `### ${b.startTime}–${b.endTime || '?'}｜${b.title || '未命名'}\n\n`;
            md += `- 项目：${getProjectName(b.projectId) || '—'}\n`;
            if (b.question) md += `- 当前问题：${b.question}\n`;
            if (b.expectedEvidence) md += `- 预期证据：${b.expectedEvidence}\n`;
            if (b.evidence) md += `- 实际证据：${b.evidence}\n`;
            if (b.nextStep) md += `- 下一步：${b.nextStep}\n`;
            if (b.focusScore != null) md += `- 整体专注：${b.focusScore}/4\n`;
            if (b.progressScore != null) md += `- 推进：${b.progressScore}/4\n`;
            if (b.segments && b.segments.length) {
                md += `- 子时段专注：\n`;
                b.segments.forEach(seg => {
                    const f = seg.focusScore != null ? seg.focusScore : (b.focusScore != null ? `${b.focusScore}（继承）` : '—');
                    md += `  - ${seg.startTime}–${seg.endTime}：${f}\n`;
                });
            }
            if (b.loopTypes && b.loopTypes.length) md += `- 闭环类型：${b.loopTypes.join('+')}\n`;
            md += `- 主线任务：${b.isMainline ? '是' : '否'}\n`;
            if (b.isMilestone) md += `- 阶段节点：是 ⭐\n`;
            md += '\n';
        });

        const nonWork = state.timeBlocks.filter(b => !b.isWork);
        if (nonWork.length) {
            md += `## 其他时间记录\n\n| 时间 | 活动 |\n|------|------|\n`;
            nonWork.forEach(b => {
                md += `| ${b.startTime}-${b.endTime || '?'} | ${b.title || ''} |\n`;
            });
            md += '\n';
        }

        md += `## 关键任务\n\n`;
        state.dailyFocus.tasks.forEach(t => {
            md += `- ${t.completed ? '✅' : '⬜'} ${t.title}${t.isMainline ? '（主线）' : ''}\n`;
        });

        md += `\n## 今日指标\n\n`;
        md += `- 总工作时长：${formatHours(m.totalWorkHours)}\n`;
        md += `- 深度工作时长：${formatHours(m.deepWorkHours)}\n`;
        md += `- 高质量工作时长：${formatHours(m.highQualityHours)}\n`;
        md += `- 专注指数：${formatPct(m.focusIndex)}\n`;
        md += `- 推进指数：${formatPct(m.progressIndex)}\n`;
        md += `- 闭环率：${formatPct(m.closureRate)}\n`;

        md += `\n## 生活状态\n\n`;
        if (state.sleep.bedTime) md += `- 入睡：${state.sleep.bedTime}\n`;
        if (state.sleep.wakeTime) md += `- 起床：${state.sleep.wakeTime}\n`;
        if (sm) md += `- 睡眠时长：${formatSleepDisplay(sm)}\n`;
        if (state.sleep.quality) md += `- 睡眠质量：${state.sleep.quality}/5\n`;
        if (state.life.exercise.done) md += `- 运动：${state.life.exercise.durationMinutes} 分钟，${state.life.exercise.type || '—'}\n`;
        if (state.life.reading.done) md += `- 阅读：${state.life.reading.durationMinutes} 分钟\n`;
        if (state.life.energy) md += `- 精力：${state.life.energy}/5\n`;
        if (state.life.mood) md += `- 心情：${state.life.mood}/5\n`;

        md += `\n## 每日回顾\n\n`;
        md += `### 今日关键产出\n\n${state.reflection.keyOutputs || '（未填写）'}\n\n`;
        md += `### 被卡住或搁置的事\n\n${state.reflection.stuckOrDropped || '（未填写）'}\n\n`;
        md += `### 明天优先级\n\n${state.reflection.tomorrowPriority || '（未填写）'}\n\n`;
        if (state.reflection.extraNotes) md += `### 自由笔记\n\n${state.reflection.extraNotes}\n\n`;

        md += `\n---\n*记录时间: ${new Date().toLocaleString('zh-CN')}*\n`;
        return md;
    }

    function checkUnclosedReminder() {
        const unclosed = getWorkBlocks(state.timeBlocks).filter(b => b.endTime && !isClosed(b));
        if (unclosed.length && !sessionStorage.getItem('unclosedWarned_' + getTodayKey())) {
            sessionStorage.setItem('unclosedWarned_' + getTodayKey(), '1');
            alert(`有 ${unclosed.length} 个工作块尚未闭环（缺证据或下一步），可在列表中点击「完成回顾」补充。`);
        }
    }

    // ========== 初始化 ==========
    function bindEvents() {
        document.getElementById('addBlockBtn').onclick = () => addBlock(false);
        document.getElementById('startWorkBtn').onclick = openStartWork;
        document.getElementById('confirmStartWork').onclick = confirmStartWork;
        document.getElementById('confirmEndWork').onclick = confirmEndWork;
        document.getElementById('ewBatchApply').onclick = () => {
            const from = Math.max(1, parseInt(document.getElementById('ewBatchFrom').value, 10) || 1) - 1;
            const to = Math.min(state.endWorkSegments.length, parseInt(document.getElementById('ewBatchTo').value, 10) || 1) - 1;
            const score = parseInt(document.getElementById('ewBatchScore').value, 10);
            for (let i = from; i <= to && i >= 0; i++) {
                state.endWorkSegments[i].focusScore = score;
            }
            renderEndWorkSegments();
            refreshEndWorkFocusLabel();
        };
        document.getElementById('toggleViewBtn').onclick = () => {
            state.viewMode = state.viewMode === 'list' ? 'timeline' : 'list';
            persist();
            renderAll();
        };
        document.getElementById('addTaskBtn').onclick = addTask;
        document.getElementById('saveBtn').onclick = () => { persist(); alert('已保存'); };
        document.getElementById('exportBtn').onclick = exportMarkdown;
        document.getElementById('clearBtn').onclick = clearDay;
        document.getElementById('projectManageBtn').onclick = openProjectManager;
        document.getElementById('addProjectBtn').onclick = addProjectFromInput;
        document.getElementById('newProjectName').onkeydown = e => { if (e.key === 'Enter') addProjectFromInput(); };

        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.onclick = () => document.getElementById(btn.dataset.close).classList.remove('show');
        });

        document.getElementById('coreQuestion').oninput = e => { state.dailyFocus.coreQuestion = e.target.value; persist(); };
        ['reflKeyOutputs', 'reflStuck', 'reflTomorrow', 'reflExtra'].forEach(id => {
            const key = { reflKeyOutputs: 'keyOutputs', reflStuck: 'stuckOrDropped', reflTomorrow: 'tomorrowPriority', reflExtra: 'extraNotes' }[id];
            document.getElementById(id).oninput = e => { state.reflection[key] = e.target.value; persist(); };
        });

        document.getElementById('bedTime').onchange = e => {
            state.sleep.bedTime = e.target.value || null;
            renderLifeUI(); persist();
        };
        document.getElementById('wakeTime').onchange = e => {
            state.sleep.wakeTime = e.target.value || null;
            renderLifeUI(); persist();
        };

        document.getElementById('exerciseDone').onchange = e => { state.life.exercise.done = e.target.checked; persist(); };
        document.getElementById('exerciseDuration').oninput = e => { state.life.exercise.durationMinutes = parseInt(e.target.value, 10) || 0; persist(); };
        document.getElementById('exerciseType').onchange = e => {
            const wrap = document.getElementById('exerciseTypeCustomWrap');
            const custom = document.getElementById('exerciseTypeCustom');
            if (e.target.value === '其他') {
                wrap.style.display = 'block';
                custom.focus();
                state.life.exercise.type = custom.value.trim();
            } else {
                wrap.style.display = 'none';
                custom.value = '';
                state.life.exercise.type = e.target.value;
            }
            persist();
        };
        document.getElementById('exerciseTypeCustom').oninput = e => {
            state.life.exercise.type = e.target.value.trim();
            persist();
        };
        document.getElementById('readingDone').onchange = e => { state.life.reading.done = e.target.checked; persist(); };
        document.getElementById('readingDuration').oninput = e => { state.life.reading.durationMinutes = parseInt(e.target.value, 10) || 0; persist(); };
        document.getElementById('readingPages').oninput = e => { state.life.reading.pages = parseInt(e.target.value, 10) || null; persist(); };
        document.getElementById('readingTakeaway').oninput = e => { state.life.reading.takeaway = e.target.value; persist(); };
    }

    function updateClock() {
        const now = new Date();
        state.date = now;
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }

    function init() {
        loadSettings();
        loadDay();
        bindEvents();
        updateClock();
        setInterval(updateClock, 1000);
        renderLifeUI();
        renderReflectionUI();
        renderAll();
        _runMetricTests();
        setTimeout(checkUnclosedReminder, 1500);
    }

    window.App = {
        selectBlock, updateBlock, updateBlockSilent, removeBlock, toggleWork, openEndWork,
        updateTask, removeTask, renderTasks, ensureProject,
        openProjectManager, updateProjectName, deleteProject, renderProjectList
    };

    window.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
